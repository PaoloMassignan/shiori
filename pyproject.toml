[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shiori"
version = "0.1.0"
description = "Task-aware prompt compression proxy"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.0",
    "tiktoken>=0.7",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
llmlingua = ["llmlingua>=0.2"]
ml = ["transformers>=4.40", "torch>=2.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "respx>=0.21",
]

[project.scripts]
shiori = "shiori.api.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/shiori"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.hatch.build]
sources = ["src"]
